name: Modern hotword final ASR benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hotwords/priority.txt"
      - "scripts/23-setup-modern-hotword-models.sh"
      - "scripts/24-benchmark-modern-hotwords.py"
      - "samples/**"
      - ".github/workflows/modern-hotword-benchmark.yml"

concurrency:
  group: modern-hotword-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache modern ASR models
        uses: actions/cache@v4
        with:
          path: |
            models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25
            models/sherpa-onnx-funasr-nano-int8-2025-12-30
          key: voiceime-modern-hotword-asr-v1
      - name: Install sherpa runtime
        run: |
          python3 -m pip install --user --break-system-packages -U sherpa-onnx
      - name: Install modern hotword candidates
        run: bash scripts/23-setup-modern-hotword-models.sh
      - name: Benchmark real speech
        run: |
          manifest="$(find samples -maxdepth 2 -name manifest.tsv -print | sort | tail -1)"
          test -n "$manifest"
          python3 scripts/24-benchmark-modern-hotwords.py "$manifest" --output-dir benchmark-results-modern
          cat benchmark-results-modern/report.md
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: modern-hotword-final-benchmark
          path: benchmark-results-modern/
          retention-days: 30
