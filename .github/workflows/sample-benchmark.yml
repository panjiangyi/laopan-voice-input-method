name: Real sample ASR benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "samples/**"
      - "voiceime-engine"
      - "scripts/09-setup-sherpa.sh"
      - "scripts/11-setup-quality.sh"
      - "scripts/15-evaluate-samples.py"

concurrency:
  group: sample-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache ASR models
        uses: actions/cache@v4
        with:
          path: models
          key: voiceime-asr-models-v1

      - name: Install streaming ASR and model
        run: bash scripts/09-setup-sherpa.sh

      - name: Install FireRedASR2 final model
        run: bash scripts/11-setup-quality.sh

      - name: Run 30-sample benchmark
        env:
          VOICEIME_LLM_ENABLED: "0"
        run: |
          manifest="$(find samples -maxdepth 2 -name manifest.tsv -print | sort | tail -1)"
          test -n "$manifest"
          echo "Benchmarking $manifest"
          python3 scripts/15-evaluate-samples.py "$manifest" --output-dir benchmark-results
          python3 scripts/16-tune-streaming.py "$manifest" --output benchmark-results/streaming-tail-sweep.tsv
          cat benchmark-results/report.md
          cat benchmark-results/streaming-tail-sweep.tsv

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: voiceime-real-sample-benchmark
          path: benchmark-results/
          retention-days: 30
