name: Modern final ASR benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hotwords/priority.txt"
      - "scripts/23-build-priority-hotwords.py"
      - "scripts/24-setup-modern-final-asr.sh"
      - "scripts/25-benchmark-modern-final.py"
      - ".github/workflows/modern-final-benchmark.yml"

concurrency:
  group: modern-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore modern ASR model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models
          key: voiceime-modern-final-v1

      - name: Install modern final ASR candidates
        run: bash scripts/24-setup-modern-final-asr.sh

      - name: Save modern ASR model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models
          key: voiceime-modern-final-v1

      - name: Run real-speech modern final A/B
        run: |
          manifest="$(find samples -maxdepth 2 -name manifest.tsv -print | sort | tail -1)"
          test -n "$manifest"
          python3 scripts/25-benchmark-modern-final.py "$manifest" --output-dir benchmark-results-modern
          cat benchmark-results-modern/modern-final-report.md

      - name: Upload modern ASR benchmark
        uses: actions/upload-artifact@v4
        with:
          name: modern-final-asr-benchmark
          path: benchmark-results-modern/
          retention-days: 30
