name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test/build runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y             python3-numpy             g++             libfcitx5core-dev             libfcitx5utils-dev             libfcitx5config-dev
      - name: Python syntax
        run: |
          python3 -m py_compile             voiceime-engine voiceime-ptt             scripts/08-offline-suite.py             tests/test_voiceime.py tests/test_engine_logic.py             tests/test_llm_corrector.py tests/test_benchmark.py             tests/native_bridge.py
      - name: Shell syntax
        run: |
          bash -n voiceime-lib.sh voiceime-begin voiceime-end voiceime-mic voiceime-reset voiceime-status
          bash -n scripts/*.sh native/*.sh
      - name: Build native Fcitx bridge
        run: bash native/build.sh
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
