name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime
        run: sudo apt-get update && sudo apt-get install -y python3-numpy
      - name: Python syntax
        run: |
          python3 -m py_compile voiceime-engine voiceime-ptt tests/test_voiceime.py tests/native_bridge.py
      - name: Shell syntax
        run: |
          bash -n voiceime-lib.sh voiceime-begin voiceime-end voiceime-mic voiceime-reset voiceime-status
          bash -n scripts/*.sh native/*.sh
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
